CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_IDLE_STACK_SIZE=256
CONFIG_ISR_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512

# Week 4: CONFIG_MAIN_THREAD_PRIORITY=10 from week 3 is gone on purpose. At the
# default 0, main outranks every thread and finishes init_hw() before any of
# them runs; then it returns and stops competing.

# Week 4 Task D: per-thread stack high-water marks, printed by `threads`.
# Not available on native_sim: build there with -DCONFIG_THREAD_ANALYZER=n.
CONFIG_THREAD_NAME=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
